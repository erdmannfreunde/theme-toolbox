services:
  _defaults:
    autoconfigure: true

  erdmannfreunde.theme_toolbox.listener.disable_css_caching:
    class: ErdmannFreunde\ThemeToolboxBundle\EventListener\DisableCssCachingListener
    public: true

  erdmannfreunde.theme_toolbox.listener.bypass_mode_alert_message:
    class: ErdmannFreunde\ThemeToolboxBundle\EventListener\BypassModeAlertMessageListener
    public: true

  ErdmannFreunde\ThemeToolboxBundle\EventListener\DataContainer\RegisterFieldsInPaletteListener:
    arguments: ['@database_connection']
    public: true

  ErdmannFreunde\ThemeToolboxBundle\EventListener\DataContainer\SaveClasses:
    arguments: ['@database_connection']
    public: true

  ErdmannFreunde\ThemeToolboxBundle\EventListener\ParseTemplateListener:
    public: true

  ErdmannFreunde\ThemeToolboxBundle\EventListener\GetAllEventsListener:
    public: true

  ErdmannFreunde\ThemeToolboxBundle\EventListener\GeneratePageListener:
    tags:
      - { name: contao.hook, hook: generatePage }

  ErdmannFreunde\ThemeToolboxBundle\EventListener\DataContainer\AdditionalFieldListener:
    arguments: ['@database_connection']
    public: true

  ErdmannFreunde\ThemeToolboxBundle\EventListener\DataContainer\ToolboxEditorCssCallback:
    public: true;
    arguments:
      - '@request_stack'

  # Theme File Editor & SCSS Services
  ErdmannFreunde\ThemeToolboxBundle\Service\ThemeScssFileManager:
    arguments:
      - '%kernel.project_dir%'
      - '@filesystem'
      - '%theme_toolbox.layout_dir%'
      - '%theme_toolbox.custom_dir%'

  ErdmannFreunde\ThemeToolboxBundle\Service\ThemeScssCompiler:
    arguments:
      - '@ErdmannFreunde\ThemeToolboxBundle\Service\ThemeScssFileManager'
      - '%kernel.project_dir%'
      - '@filesystem'
      - '%kernel.debug%'
      - '@?logger'

  ErdmannFreunde\ThemeToolboxBundle\Service\GoogleFontsService:
    arguments:
      - '@?logger'

  ErdmannFreunde\ThemeToolboxBundle\Service\ThemeImageFileManager:
    arguments:
      - '%kernel.project_dir%'
      - '@filesystem'
      - '%theme_toolbox.layout_dir%'
      - '%theme_toolbox.custom_dir%'

  ErdmannFreunde\ThemeToolboxBundle\Service\ThemeJsFileManager:
    arguments:
      - '%kernel.project_dir%'
      - '@filesystem'
      - '%theme_toolbox.layout_dir%'
      - '%theme_toolbox.custom_dir%'

  ErdmannFreunde\ThemeToolboxBundle\Controller\Backend\ThemeFileEditorController:
    arguments:
      - '@ErdmannFreunde\ThemeToolboxBundle\Service\ThemeScssFileManager'
      - '@ErdmannFreunde\ThemeToolboxBundle\Service\GoogleFontsService'
      - '@contao.csrf.token_manager'
      - '@translator'
      - '@ErdmannFreunde\ThemeToolboxBundle\Service\ThemeImageFileManager'
      - '@ErdmannFreunde\ThemeToolboxBundle\Service\ThemeJsFileManager'
    calls:
      - [setContainer, ['@service_container']]
    tags: ['controller.service_arguments']

  ErdmannFreunde\ThemeToolboxBundle\EventListener\ThemeScssGeneratePageListener:
    arguments:
      - '@ErdmannFreunde\ThemeToolboxBundle\Service\ThemeScssCompiler'
      - '@ErdmannFreunde\ThemeToolboxBundle\Service\ThemeScssFileManager'

  ErdmannFreunde\ThemeToolboxBundle\EventListener\DataContainer\LayoutThemeScssOptionsCallback:
    arguments:
      - '@ErdmannFreunde\ThemeToolboxBundle\Service\ThemeScssFileManager'
    public: true

  ErdmannFreunde\ThemeToolboxBundle\Service\ThemeUpdateService:
    arguments:
      - '%kernel.project_dir%'
      - '@filesystem'
      - '%theme_toolbox.layout_dir%'


  ErdmannFreunde\ThemeToolboxBundle\Controller\Backend\ThemeUpdateController:
    arguments:
      - '@ErdmannFreunde\ThemeToolboxBundle\Service\ThemeUpdateService'
      - '@contao.csrf.token_manager'
      - '@translator'
    calls:
      - [setContainer, ['@service_container']]
    tags: ['controller.service_arguments']

  ErdmannFreunde\ThemeToolboxBundle\EventListener\BackendModuleRedirectListener:
    arguments:
      - '@router'

  ErdmannFreunde\ThemeToolboxBundle\Twig\ThemeToolboxTwigExtension:
    arguments:
      - '@ErdmannFreunde\ThemeToolboxBundle\Service\ThemeScssCompiler'
      - '@ErdmannFreunde\ThemeToolboxBundle\Service\ThemeScssFileManager'
      - '%kernel.project_dir%'
